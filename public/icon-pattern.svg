<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <style>
      .icon { fill: white; opacity: 0.85; }
    </style>
  </defs>
  <!-- Row 1 -->
  <!-- Pen Tool -->
  <path class="icon" d="M25 10 L30 30 L25 28 L20 30 Z" transform="translate(0,0)"/>
  <!-- Grid -->
  <rect class="icon" x="70" y="10" width="8" height="8" rx="1"/>
  <rect class="icon" x="80" y="10" width="8" height="8" rx="1"/>
  <rect class="icon" x="70" y="20" width="8" height="8" rx="1"/>
  <rect class="icon" x="80" y="20" width="8" height="8" rx="1"/>
  <!-- Layers -->
  <path class="icon" d="M140 15 L155 22 L140 29 L125 22 Z"/>
  <path class="icon" d="M140 20 L155 27 L140 34 L125 27 Z" opacity="0.5"/>
  <!-- Circle -->
  <circle class="icon" cx="190" cy="20" r="8"/>
  <!-- Row 2 -->
  <!-- Triangle -->
  <path class="icon" d="M25 65 L33 80 L17 80 Z"/>
  <!-- Bezier -->
  <path class="icon" d="M70 75 Q80 60 90 75" fill="none" stroke="white" stroke-width="2.5" opacity="0.85"/>
  <circle class="icon" cx="70" cy="75" r="2.5"/>
  <circle class="icon" cx="90" cy="75" r="2.5"/>
  <!-- Star -->
  <path class="icon" d="M140 62 L143 72 L153 72 L145 78 L148 88 L140 82 L132 88 L135 78 L127 72 L137 72 Z"/>
  <!-- Diamond -->
  <path class="icon" d="M190 65 L198 75 L190 85 L182 75 Z"/>
  <!-- Row 3 -->
  <!-- Hexagon -->
  <path class="icon" d="M25 120 L33 115 L41 120 L41 130 L33 135 L25 130 Z"/>
  <!-- Cross/Plus -->
  <path class="icon" d="M77 115 h6 v-6 h6 v6 h6 v6 h-6 v6 h-6 v-6 h-6 z"/>
  <!-- Eye -->
  <ellipse class="icon" cx="140" cy="125" rx="14" ry="8"/>
  <circle cx="140" cy="125" r="4" fill="black"/>
  <!-- Type T -->
  <path class="icon" d="M182 115 h16 v4 h-6 v14 h-4 v-14 h-6 z"/>
  <!-- Row 4 -->
  <!-- Heart -->
  <path class="icon" d="M25 170 C25 165 18 160 15 165 C12 160 5 165 5 170 C5 178 15 185 15 185 C15 185 25 178 25 170 Z" transform="translate(12, 0)"/>
  <!-- Bolt -->
  <path class="icon" d="M82 160 L76 172 L81 172 L78 185 L88 170 L83 170 L86 160 Z"/>
  <!-- Square rounded -->
  <rect class="icon" x="127" y="162" width="16" height="16" rx="4"/>
  <!-- Wave -->
  <path class="icon" d="M175 175 Q182 165 190 175 Q198 185 205 175" fill="none" stroke="white" stroke-width="2.5" opacity="0.85"/>
</svg>
